syntax = "proto3";

package dfs;

// ===========================================================
//  Servicio NameNode <-> Cliente
// ===========================================================
service NameNodeService {
  // Login inicial con usuario y contraseña
  rpc Login (LoginRequest) returns (LoginResponse);

  // Subir un archivo: cliente indica nombre y tamaño, NN responde con asignación de bloques
  rpc PutFile (PutFileRequest) returns (PutFileResponse);

  // Descargar un archivo: cliente pide info de bloques
  rpc GetFile (GetFileRequest) returns (GetFileResponse);

  // Listar archivos del usuario
  rpc ListFiles (ListFilesRequest) returns (ListFilesResponse);

  // Eliminar un archivo
  rpc RemoveFile (RemoveFileRequest) returns (RemoveFileResponse);

  // Consulta de réplicas para un bloque
  rpc GetReplicas (ReplicaRequest) returns (ReplicaResponse);

  // Manejo de directorios
  rpc Mkdir (MkdirRequest) returns (MkdirResponse);
  rpc Rmdir (RmdirRequest) returns (RmdirResponse);
}

// ===========================================================
//  Servicio Cliente <-> DataNode
// ===========================================================
service DataNodeService {
  rpc UploadBlock (BlockUploadRequest) returns (BlockUploadResponse);
  rpc DownloadBlock (BlockDownloadRequest) returns (BlockDownloadResponse);
  rpc ReplicateBlock (BlockReplicationRequest) returns (BlockReplicationResponse);
}

// ===========================================================
//  Servicio interno NameNode <-> DataNodes (Cluster Management)
// ===========================================================
service ClusterService {
  rpc RegisterDataNode (RegisterDataNodeRequest) returns (RegisterDataNodeResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportBlock (ReportBlockRequest) returns (ReportBlockResponse);
}

// ===========================================================
//  MENSAJES
// ===========================================================

// ---------- Autenticación ----------
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string session_token = 3;
}

// ---------- Cliente <-> NameNode ----------
message PutFileRequest {
  string username = 1;
  string session_token = 2;
  string filename = 3;
  int64 filesize = 4;
}

message PutFileResponse {
  repeated BlockLocation blocks = 1;
}

message GetFileRequest {
  string username = 1;
  string session_token = 2;
  string filename = 3;
}

message GetFileResponse {
  repeated BlockLocation blocks = 1;
}

message ListFilesRequest {
  string username = 1;
  string session_token = 2;
}

message ListFilesResponse {
  repeated string filenames = 1;
}

message RemoveFileRequest {
  string username = 1;
  string session_token = 2;
  string filename = 3;
}

message RemoveFileResponse {
  bool success = 1;
  string message = 2;
}

message ReplicaRequest {
  int64 block_id = 1;
}

message ReplicaResponse {
  repeated string replica_datanodes = 1;
}

message MkdirRequest {
  string username = 1;
  string session_token = 2;
  string path = 3;
}

message MkdirResponse {
  bool success = 1;
  string message = 2;
}

message RmdirRequest {
  string username = 1;
  string session_token = 2;
  string path = 3;
}

message RmdirResponse {
  bool success = 1;
  string message = 2;
}

// ---------- Cliente <-> DataNode ----------
message BlockUploadRequest {
  int64 block_id = 1;
  string filename = 2;
  bytes data = 3;
}

message BlockUploadResponse {
  bool success = 1;
}

message BlockDownloadRequest {
  int64 block_id = 1;
  string filename = 2;
}

message BlockDownloadResponse {
  bytes data = 1;
}

// ---------- NameNode <-> DataNodes ----------
message RegisterDataNodeRequest {
  string datanode_id = 1;
  string ip_address = 2;
  int32 port = 3;
}

message RegisterDataNodeResponse {
  bool success = 1;
}

message HeartbeatRequest {
  string datanode_id = 1;
  string ip_address = 2;
  int32 port = 3;
}

message HeartbeatResponse {
  bool success = 1;
}

message ReportBlockRequest {
  string datanode_id = 1;
  string ip_address = 2;
  int32 port = 3;
  repeated BlockReport blocks = 4;
}

message ReportBlockResponse {
  bool success = 1;
}

message BlockReport {
  int64 block_id = 1;
  string filename = 2;
}

// ---------- Estructuras comunes ----------
message BlockLocation {
  int64 block_id = 1;
  string primary_address = 2;
  repeated string replica_addresses = 3;
  int32 block_index = 4;
}

// ---------- Datanodes <-> DataNodes ----------
message BlockReplicationRequest {
  int64 block_id = 1;
  string filename = 2;
  bytes data = 3;
}

message BlockReplicationResponse {
  bool success = 1;
}
